# IMU 采集 Server
#
# tcpdump 示例（注意方向）:
#   192.168.1.201.2369 > 192.168.1.102.2368: UDP, length 67
#   ^IMU IP:源端口2369    ^本机IP:监听端口2368
#
# 环境变量（推荐仅设置子网）:
#   IMU_SUBNET=192.168.1.*
# 可选高级覆盖:
#   IMU_LOCAL_IP=192.168.1.102      # 显式指定本机 bind 地址
#   IMU_INTERFACE=enx00e01a514f91   # 显式指定网卡（一般无需设置）

capture:
  hz: 10
  auto_discover: true
  discover_all: true
  discover_subnet: 192.168.1.*
  discover_rescan_sec: 30
  bind_interface: 0.0.0.0
  probe_on_start: true
  mock: false
  discover_packet_sizes: [59, 67]
  discover_ports: [2368]

shm:
  name_prefix: imu_
  slot_count: 16
  slot_capacity_bytes: 4096

imus:
  - name: imu0
    frame_id: imu_link
    enabled: true
    transport: udp
    port: 2368
    imu_src_port: 2369
  # host_address / imu_ip 可由 IMU_LOCAL_IP 与自动发现填充

clients:
  foxglove:
    enabled: false
  mcap:
    enabled: false

web:
  enabled: true
  host: 0.0.0.0
  port: 28090

runtime:
  status_interval_sec: 5.0
