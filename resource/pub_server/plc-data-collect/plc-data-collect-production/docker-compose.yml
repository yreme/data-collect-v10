services:
  crane-monitor:
    #build:
    #  context: .
    #  network: host
    #image: plc-data-collect:local
    image: plc-data-collect:simple-6.9.17
    #container_name: crane727r-monitor
    restart: unless-stopped
    network_mode: host
    environment:
      WEB_PORT: "${WEB_PORT:-8080}"
      UDP_PORT: "${UDP_PORT:-12730}"
      MCAP_ENABLED: "${MCAP_ENABLED:-true}"
      MCAP_DEDUP_ENABLED: "${MCAP_DEDUP_ENABLED:-true}"
      MCAP_HOURLY_DIR: /data/mcap/hourly
      MCAP_SHORT_DIR: /data/mcap/short
      MCAP_HOURLY_ROTATION_SECONDS: "${MCAP_HOURLY_ROTATION_SECONDS:-3600}"
      MCAP_SHORT_ROTATION_SECONDS: "${MCAP_SHORT_ROTATION_SECONDS:-600}"
      MCAP_HOURLY_RETENTION_DAYS: "${MCAP_HOURLY_RETENTION_DAYS:-30}"
      MCAP_SHORT_RETENTION_DAYS: "${MCAP_SHORT_RETENTION_DAYS:-1}"
      MCAP_LIST_LIMIT: "${MCAP_LIST_LIMIT:-10}"
      HEALTH_TIMEOUT: "${HEALTH_TIMEOUT:-5}"
    volumes:
      - ${MCAP_HOURLY_HOST_DIR:-./data/mcap/hourly}:/data/mcap/hourly
      - ${MCAP_SHORT_HOST_DIR:-./data/mcap/short}:/data/mcap/short
      - ./foxglove:/app/plc-collect/foxglove:ro
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/status')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
