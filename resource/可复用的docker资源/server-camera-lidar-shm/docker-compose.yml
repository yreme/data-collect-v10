# 将采集的数据实时放到共享内存（GigE 相机 + 雷达）
# 启动: docker compose --env-file ../.env up -d
services:
  server-gige-sync:
    image: ${GIGE_IMAGE}
    network_mode: host
    ipc: host
    restart: unless-stopped
    volumes:
      - ../configs:/app/configs:ro
    environment:
      - GIGE_DISCOVER_FILTER=/app/configs/${SENSORS_CONFIG}
      - CAPTURE_HZ=${CAPTURE_HZ:-10}
      - CAPTURE_MOCK=${CAPTURE_MOCK:-0}
    container_name: server-gige-sync

  server-lidar-sync:
    image: ${LIDAR_IMAGE}
    network_mode: host
    ipc: host
    restart: unless-stopped
    volumes:
      - ../configs:/app/configs:ro
    command: ["server", "-c", "/app/configs/${SENSORS_CONFIG}"]
    environment:
      - LIDAR_SUBNET=${LIDAR_SUBNET:-192.168.1.*}
      - CAPTURE_HZ=${CAPTURE_HZ:-10}
      - CAPTURE_MOCK=${CAPTURE_MOCK:-0}
    container_name: server-lidar-sync
