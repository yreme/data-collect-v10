[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorhub"
version = "0.1.0"
description = "Zenoh-based multi-sensor data bus SDK (keys, frame header, node, sync grid)."
requires-python = ">=3.8"
dependencies = [
    "eclipse-zenoh==1.10.1",
    "numpy>=1.21",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["sensorhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
